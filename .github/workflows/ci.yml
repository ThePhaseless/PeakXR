name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Analyzer warnings are errors (Directory.Build.props).
      CI: "true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Unity and Valve XR tarballs fetched by tools/fetch-xr-deps.sh; their versions live in the script.
      - uses: actions/cache@v6
        with:
          path: deps/cache
          key: xr-deps-${{ hashFiles('tools/fetch-xr-deps.sh') }}
      - run: mise run format-check
      # No game on the runner: the projects compile against refs/peak/.
      - run: mise run build
      - run: mise run test
