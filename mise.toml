[tools]
dotnet = "10"
"dotnet:ilspycmd" = "9"
"dotnet:csharpier" = "1.3.0"
# Thunderstore CLI; only used for future publishing (see thunderstore.toml)
"dotnet:tcli" = "0.2.4"
# JSON parsing in tools/*.sh (Unity registry metadata, asmdefs)
jq = "1.8"

[env]
# ilspycmd targets net8; let it run on the newer mise-managed runtime
DOTNET_ROLL_FORWARD = "Major"
PEAK_DIR = "{{env.HOME}}/.local/share/Steam/steamapps/common/PEAK"

# ---------------------------------------------------------------------------------------------
# Tasks. Scripts live in tools/; every task runs with the tools and env above.
# ---------------------------------------------------------------------------------------------

[tasks.deps]
description = "Fetch, verify and build the XR runtime deps (OpenXR + OpenVR fallback) into deps/"
run = "bash tools/fetch-xr-deps.sh"

[tasks.build]
description = "Build the solution (Release)"
depends = ["deps"]
run = "dotnet build PeakXR.sln -c Release"

[tasks.test]
description = "Run the unit tests (Release)"
run = "dotnet test PeakXR.sln -c Release"

[tasks.coverage]
description = "Run the unit tests with coverlet coverage (cobertura XML in TestResults/)"
run = 'dotnet test PeakXR.sln -c Release --coverlet --coverlet-output-format cobertura --coverlet-include "[PeakXR.Core]*"'

[tasks.format]
description = "Format all C# with CSharpier"
run = "csharpier format ."

[tasks.format-check]
description = "Fail if any C# file is not CSharpier-formatted"
run = "csharpier check ."

[tasks.package]
description = "Build the Thunderstore zip and an unpacked copy into dist/"
depends = ["build"]
run = "bash tools/package.sh"

[tasks.deploy]
description = "Copy dist/PeakXR/BepInEx into the game's BepInEx folder (run `mise run package` first)"
run = "bash tools/deploy.sh"

[tasks.decompile]
description = "Re-decompile Assembly-CSharp and Zorro.* into decomp/ (after a game update)"
run = "bash tools/decompile.sh"

[tasks.compat-check]
description = "Print game, Unity and XR deps versions; later: diff patch targets"
run = "bash tools/compat-check.sh"
