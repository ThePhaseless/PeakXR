# Thunderstore CLI (tcli) config for future publishing: `tcli publish --file dist/PeakXR-<version>.zip --token ...` after `mise run package`.
# `mise run package` (tools/package.sh) stays the packager: the layout needs the preloader, native XR
# runtimes and licenses that tcli's build step cannot assemble. tcli only uploads the finished zip.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "ThePhaseless"
name = "PeakXR"
# Set by tools/package.sh from <Version> in Directory.Build.props; bump it there.
versionNumber = "0.2.1"
description = "Play PEAK in VR. Climb by grabbing the rock, pick things up with your hands, eat by lifting food to your mouth and climb ropes hand over hand. Friends without the mod can still play with you. Early release, mostly tested on SteamVR."
websiteUrl = "https://github.com/ThePhaseless/PeakXR"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.75301"

[build]
icon = "./assets/icon.png"
readme = "./dist/PeakXR/README.md"
outdir = "./dist"

[[build.copy]]
source = "./dist/PeakXR/BepInEx"
target = "BepInEx"

[publish]
repository = "https://thunderstore.io"
communities = ["peak"]

[publish.categories]
# ai-generated: required by Thunderstore's global rules for AI-written code (wiki.thunderstore.io/moderation/global-rules).
peak = ["mods", "client", "ai-generated"]
